# TokyoDay for lazygit, part of cosmic-tokyoday-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/tokyoday.yml and
# zsh/tokyoday.zsh sets LG_CONFIG_FILE to "config.yml,tokyoday.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/tokyoday.yml"
gui:
  theme:
    activeBorderColor:
      - "#2959AA"
      - bold
    inactiveBorderColor:
      - "#B6B9C1"
    searchingActiveBorderColor:
      - "#8F5E15"
      - bold
    optionsTextColor:
      - "#5C5E69"
    selectedLineBgColor:
      - "#C5C7CD"
    inactiveViewSelectedLineBgColor:
      - "#E6E7ED"
    cherryPickedCommitFgColor:
      - "#D6D8DF"
    cherryPickedCommitBgColor:
      - "#8F5E15"
    markedBaseCommitFgColor:
      - "#D6D8DF"
    markedBaseCommitBgColor:
      - "#33635C"
    unstagedChangesColor:
      - "#8C4351"
    defaultFgColor:
      - "#343B59"
  authorColors:
    "*": "#8F5E15"
