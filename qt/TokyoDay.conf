# TokyoDay colour scheme for qt5ct / qt6ct, part of cosmic-tokyoday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> TokyoDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#343b59, #dee0e6, #dee0e6, #b6b9c1, #c5c7cd, #d6d8df, #343b59, #2c324b, #343b59, #e6e7ed, #e6e7ed, #c5c7cd, #2959aa, #e6e7ed, #2959aa, #2959aa, #dee0e6, #e6e7ed, #dee0e6, #343b59, #707280
disabled_colors=#888b94, #dee0e6, #dee0e6, #b6b9c1, #c5c7cd, #d6d8df, #888b94, #5c5e69, #888b94, #e6e7ed, #e6e7ed, #c5c7cd, #b6b9c1, #5c5e69, #707280, #707280, #dee0e6, #e6e7ed, #dee0e6, #343b59, #b6b9c1
inactive_colors=#343b59, #dee0e6, #dee0e6, #b6b9c1, #c5c7cd, #d6d8df, #343b59, #2c324b, #343b59, #e6e7ed, #e6e7ed, #c5c7cd, #2959aa, #e6e7ed, #2959aa, #2959aa, #dee0e6, #e6e7ed, #dee0e6, #343b59, #707280
